<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,sans-serif;
}

body{

    background:url("background.jpg") center/cover no-repeat;

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

}

.overlay{

    width:100%;
    height:100%;

    background:rgba(0,0,0,.55);

    display:flex;

    justify-content:center;

    align-items:center;

}

.box{

    background:rgba(255,255,255,.12);

    backdrop-filter:blur(12px);

    padding:40px;

    border-radius:20px;

    text-align:center;

    color:white;

    width:330px;

}

h1{

    margin-bottom:20px;

}

input{

    width:100%;

    padding:15px;

    font-size:22px;

    text-align:center;

    border:none;

    border-radius:10px;

    margin:20px 0;

    outline:none;

}

button{

    width:100%;

    padding:15px;

    border:none;

    border-radius:10px;

    background:#00bfff;

    color:white;

    font-size:18px;

    cursor:pointer;

}

button:hover{

    background:#0099dd;

}

#error{

    color:#ff5b5b;

    margin-top:15px;

}

</style>

</head>

<body>

<div class="overlay">

<div class="box">

<h1>🔒 Enter Secret PIN</h1>

<input
type="password"
id="pin"
maxlength="4"
placeholder="****">

<button onclick="checkPin()">

Unlock

</button>

<p id="error"></p>

</div>

</div>

<script>

function checkPin(){

let pin=document.getElementById("pin").value;

if(pin==="1234"){

window.location.href="intro.html";

}

else{

document.getElementById("error").innerHTML="Wrong PIN!";

}

}

</script>

</body>
</html>
