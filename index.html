<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Secret Birthday</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="overlay">

<div class="lock-screen">

<h1>🔒</h1>

<h2>Enter Secret PIN</h2>

<p>Only Legends Can Enter</p>

<!-- PIN Dots -->

<div class="pin-display">

<span class="dot" id="d1"></span>

<span class="dot" id="d2"></span>

<span class="dot" id="d3"></span>

<span class="dot" id="d4"></span>

</div>

<!-- Number Pad -->

<div class="keypad">

<button onclick="press(1)">1</button>

<button onclick="press(2)">2</button>

<button onclick="press(3)">3</button>

<button onclick="press(4)">4</button>

<button onclick="press(5)">5</button>

<button onclick="press(6)">6</button>

<button onclick="press(7)">7</button>

<button onclick="press(8)">8</button>

<button onclick="press(9)">9</button>

<button onclick="clearPin()">⌫</button>

<button onclick="press(0)">0</button>

<button onclick="checkPin()">✓</button>

</div>

<p id="message"></p>

</div>

</div>

<script src="script.js"></script>

</body>

</html>
